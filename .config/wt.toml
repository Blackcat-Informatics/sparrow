#
# Worktree seeding policy for Sparrow (worktrunk project config, issue #12).
#
# Stage seeds each new worktree (`stagectl open`, `stagectl native-worktree` and worktrunk's
# `pre-start = "stagectl seed"`) in two steps:
#
#   1. `wt step copy-ignored` reflinks the primary checkout's gitignored files. This list keeps
#      credentials, stores, backups, intake roots and probe data out. Stage's own config already
#      excludes `target`, `.stage/` and virtualenvs.
#   2. The Stage cargo wrapper (`cargo --stage-seed-only`, and on a first build) reflinks the
#      managed /opt target directory from the most reusable sibling checkout, so release builds
#      and tests start warm (docs/deployment.md records the measured times).
#
# Each name below is one this host actually keeps under ~/.local/state/sparrow,
# ~/.local/share/sparrow, ~/.config/sparrow or /SPARROW; `make seed-excludes-check` fails when an
# exclusion no longer names anything (tools/seed-excludes-check.sh), except the guards it lists.
[step.copy-ignored]
exclude = [
    # Credentials: Sparrow reads no .env, but a copy would spread one into every worktree. The CHAP
    # secret is tcp.secret.
    "/.env",
    "/.env.*",
    "*.secret",
    # Kept images (make install-bin) are the primary checkout's commit; a worktree builds its own.
    "/bin/",
    # Stores, backups, intake roots, the shipper's state and watch definitions, lexicon bundles.
    "store/",
    "backups/",
    "intake/",
    "ship/",
    "ship-watches/",
    "lexicons-*/",
    "development*/",
    # Probe and qualification data (mktemp-named stores and image sets).
    "qualification-*/",
    "*-qualification-*/",
    "*-qual-*/",
    "*-qualified-*/",
    "*-images-*/",
    "*-cancel-*/",
    "*-disconnect-*/",
    "*-refusals-*/",
    "*-restored-backup-*/",
    "interrupt-startup-*/",
    "rpc-drain-traffic-*/",
    "btrfs-quota-*/",
    "json-pages-*/",
    "disk-query-*/",
]
