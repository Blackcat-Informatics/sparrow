[workspace]
resolver = "3"
members = ["crates/sparrow-helper-census", "crates/sparrow-archive", "crates/sparrow-core", "crates/sparrow-client", "crates/sparrow-server", "crates/sparrow-test-support"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
authors = ["Blackcat Informatics Inc."]
publish = false
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"

[workspace.dependencies]
blake3 = "1"
rocksdb = { version = "0.25", default-features = false, features = ["lz4", "zstd", "bindgen-runtime"] }
purrdf = "=4"
purrdf-hash = "=4"
purrdf-lex = "=4"
purrdf-ed25519 = "=4"
purrdf-core = "=4"
getrandom = "0.3"
rustix = { version = "1.1.5", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std", "fmt"] }
capnp = "0.27"
capnp-rpc = "0.27"
capnpc = "0.27"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-std", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[workspace.lints.rust]
unreachable_pub = "deny"
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
