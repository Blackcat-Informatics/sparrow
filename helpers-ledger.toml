# These are reuse rules, not declarations of compiled runtime dependencies.
# Runtime callers use the native owners below; there are no sanctioned clones.

[[job]]
id = "hex"
summary = "Base16: render bytes as lowercase hex, and read hex text back into bytes."
home = "purrdf:purrdf_hash::hex::encode"
entry_points = [
  "purrdf_hash::hex::encode_upper",
  "purrdf_hash::hex::decode",
  "purrdf_hash::hex::decode_canonical",
  "purrdf_hash::hex::decode_32",
  "purrdf_hash::hex::decode_32_canonical",
]
spec = "RFC 4648 section 8 (base16)."
vectors = []
bench = []
enforced = true

[job.forbidden]
constants = []
# A per-byte `{:02x}` loop, a `u8::from_str_radix(_, 16)` pair decode, or a
# spelt-out digit table is a second base16 codec.
fingerprints = ["rule:hex-format-loop", "rule:hex-pair-radix", "rule:hex-table"]
names = ['^(un)?hex$']

