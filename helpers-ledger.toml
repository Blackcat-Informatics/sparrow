[[job]]
id = "store-counters"
summary = "One WriteBatch observer, called in Writer::apply after the per-source counters for every write, keeps the store-counter rows (records, retained records, artifacts, graph declarations, record graphs, payload chunks, JSON projections and each migration's done count) exact in the same batch: key existence and eviction changes within each row's bound, plus the keys a checkpoint move passes, read before the batch. Underflow or a missing row refuses with STORAGE_FAILURE, never clamped. status, unique_payload_chunks and the migration report read the rows from one snapshot without the writer lock; while the first online migration seeds them they report the rows as pending, exact through its watermark, and nothing recounts at run time (the recount is a test-support audit). Batches fold through the one durability::observe_batch, which refuses a batch holding a range delete."
