[[job]]
id = "source-summary-counters"
summary = "One WriteBatch observer, called in Writer::apply for every catalog write, adds the exact per-source counter, artifact retained-count and per-source artifact index row changes for the batch's artifact, artifact-retirement and record changes; negative or missing counters refuse with STORAGE_FAILURE naming the source, never clamped. One online migration, fenced and seeded at open behind the source summary writer families and paged by the maintenance worker, seeds the rows from existing artifact and record entries; until it completes, readers add a Completion that runs the migration's own counting passes to the end over a snapshot without the writer lock through the one Rows sink, once per sources capture and once per bounded window of owed rows a live artifact listing reaches, charging what it holds to the page admission, so listings answer as after it. Source keys use the one BLAKE3 source-key hash shared with the source context, source time and diagnostic indexes; it and the source context observer fold batches through the one durability::observe_batch."
