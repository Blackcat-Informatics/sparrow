name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      benchmark_cache:
        description: Compare dependency and workspace build caches
        type: boolean
        default: false
      benchmark_source_change:
        description: Change a Rust source file during the cache comparison
        type: boolean
        default: false
      benchmark_suites:
        description: Compare serial and parallel test-suite execution
        type: boolean
        default: false
      benchmark_lanes:
        description: Compare the full gate with independent compile and test jobs
        type: boolean
        default: false

# A newer push to a pull request cancels the run the previous push started.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.benchmark_suites && '-suite-benchmark' || '' }}${{ inputs.benchmark_lanes && '-lane-benchmark' || '' }}${{ inputs.benchmark_cache && inputs.benchmark_source_change && '-edited-cache-benchmark' || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.benchmark_cache && format('Cache benchmark ({0})', matrix.cache) || inputs.benchmark_suites && 'Suite timing benchmark' || inputs.benchmark_lanes && format('Lane benchmark ({0})', matrix.lane) || 'make check' }}
    strategy:
      fail-fast: false
      matrix:
        cache: ${{ fromJSON(inputs.benchmark_cache && '["dependencies", "workspace"]' || '["dependencies"]') }}
        lane: ${{ fromJSON(inputs.benchmark_lanes && '["full", "compile", "test"]' || '["full"]') }}
    # Inert anywhere but github.com, so a Forgejo mirror that reads
    # .github/workflows never runs it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    # Cold release builds of RocksDB and the workspace are slow; the cache
    # shortens later runs.
    timeout-minutes: 120
    steps:
      # The gate expects PurRDF beside the Sparrow checkout at ../purrdf: the
      # tests archive its text lexicons and the census archives its source.
      - name: Checkout Sparrow
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: sparrow
          persist-credentials: false

      - name: Change a Rust compile input for the cache comparison
        if: inputs.benchmark_cache && inputs.benchmark_source_change
        working-directory: sparrow
        run: printf '\n// Workspace cache benchmark source change.\n' >> crates/sparrow-limits/src/lib.rs

      - name: Read the pinned PurRDF revision
        id: purrdf
        working-directory: sparrow
        run: |
          revision="$(sed -n 's/^git_revision = "\([0-9a-f]\{40\}\)"$/\1/p' registry/compatibility.toml)"
          if [ "$(printf '%s\n' "$revision" | grep -c .)" != 1 ]; then
            echo "error: registry/compatibility.toml must name exactly one 40-hex git_revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout PurRDF at the pinned revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Blackcat-Informatics/purrdf
          ref: ${{ steps.purrdf.outputs.revision }}
          path: purrdf
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends b3sum capnproto libclang-dev clang libcap2-bin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo and target
        id: cargo-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: sparrow
          key: ${{ inputs.benchmark_cache && format('workspace-benchmark-v1-{0}', matrix.cache) || '' }}
          cache-workspace-crates: ${{ matrix.cache == 'workspace' }}
          save-if: ${{ !inputs.benchmark_lanes }}

      - name: Require the same warm cache for the lane comparison
        if: inputs.benchmark_lanes
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true

      - name: Install the commit hook
        working-directory: sparrow
        run: make install-hooks

      - name: Install the helper census
        if: matrix.lane != 'test'
        working-directory: sparrow
        run: make install-census

      - name: make check
        if: matrix.lane == 'full'
        working-directory: sparrow
        env:
          CARGO_TERM_VERBOSE: ${{ inputs.benchmark_cache && 'true' || 'false' }}
        run: make check

      - name: Run compile and census checks
        if: matrix.lane == 'compile'
        working-directory: sparrow
        run: make check-compile census-check

      - name: Run release tests
        if: matrix.lane == 'test'
        working-directory: sparrow
        run: make tools-check test

      - name: Compare serial and parallel release suites
        if: inputs.benchmark_suites
        working-directory: sparrow
        run: |
          cargo test --locked --release --workspace --no-run --message-format=json > "$RUNNER_TEMP/sparrow-test-binaries.json"
          python3 tools/benchmark-test-suites.py "$RUNNER_TEMP/sparrow-test-binaries.json" "$RUNNER_TEMP/sparrow-test-benchmark"
