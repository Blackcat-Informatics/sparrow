name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel obsolete pull request runs. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  compile:
    if: github.server_url == 'https://github.com'
    uses: ./.github/workflows/ci-lane.yaml
    with:
      lane: compile

  test:
    if: github.server_url == 'https://github.com'
    uses: ./.github/workflows/ci-lane.yaml
    with:
      lane: test

  check:
    name: make check
    if: always() && github.server_url == 'https://github.com'
    needs: [compile, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require both jobs to pass
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          printf 'Compile and census checks %s\nRelease tests %s\n' "$COMPILE_RESULT" "$TEST_RESULT"
          test "$COMPILE_RESULT" = success && test "$TEST_RESULT" = success
