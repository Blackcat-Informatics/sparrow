name: Bug report
description: Something in Sparrow misbehaves, such as wrong results, lost or retained data, a crash or a refusal you did not expect.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Sparrow reports coverage,
        refusals and partial results explicitly, so please include the exact
        typed result or error it returned. Do not paste secrets, secret-file
        contents or private log data; reduce the input to a synthetic sample.
        Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Actual behaviour versus expected behaviour, with the exact error, refusal or result Sparrow reported.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest synthetic input (JSONL, Markdown, log text or syslog
        frame), the configuration it needs, and the CLI command, MCP tool call
        or RPC operation that triggers it.
      placeholder: |
        Input sample:

        Configuration (relevant keys only):

        Command or call:
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where did you hit this?
      options:
        - CLI
        - stdio MCP adapter
        - Cap'n Proto RPC (Unix socket)
        - Cap'n Proto RPC (TCP)
        - Rust client or tracing layer
        - consume or tail watch
        - syslog listener
        - storage, retention or pins
        - build or test gate
        - Multiple / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: The Sparrow commit you built (git rev-parse HEAD) and the store schema version reported by status.
      placeholder: "abc1234, schema 62"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Linux distribution, kernel, architecture, filesystem and rustc version.
      placeholder: "Debian 13, Linux 6.12, x86_64, ext4, rustc 1.98"
