[package]
name = "sparrow-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sparrowd"
path = "src/main.rs"

[[bin]]
name = "sparrow"
path = "src/bin/sparrow.rs"

[dependencies]
sparrow-core = { path = "../sparrow-core" }
sparrow-client = { path = "../sparrow-client" }
rustix = { workspace = true, features = ["process", "net"] }
purrdf-lex.workspace = true
purrdf-hash.workspace = true
purrdf.workspace = true
capnp.workspace = true
capnp-rpc.workspace = true
getrandom.workspace = true
futures.workspace = true
tokio-util.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# Sub-second delivery timing for tests only; the production dependency above cannot reach it.
sparrow-client = { path = "../sparrow-client", features = ["test-timing"] }
sparrow-test-support = { path = "../sparrow-test-support" }
# The paused clock proves the watch worker's waits are events, not ticks.
tokio = { workspace = true, features = ["test-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile = "3"

[lints]
workspace = true
