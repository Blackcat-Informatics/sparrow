#
# Installed as /etc/tmpfiles.d/sparrow.conf by deploy/install.sh and applied with
# `systemd-tmpfiles --create sparrow.conf` (and at every boot). It creates the layout when absent
# and restores these modes, owners and ACLs when present; it never removes anything (no age).
# deploy/README.md, "Permissions", explains each line; the modes, ACLs and the writers' umasks are
# designed together, so change them together.
#
# /var/lib/sparrow: the group traverses to the store and the roots.
d /var/lib/sparrow 0750 root sparrow -
# The store and socket. The daemon itself sets 0710 when it opens the store. No ACL: its chmod
# would mask one away.
d /var/lib/sparrow/store 0710 sparrow sparrow -
# Consume roots, one directory per watch. The default ACL gives every new root a named entry for
# the sparrow group, rwx whatever the creator's umask, so the daemon can claim and delete in a root
# a member made. No setgid bit: a root would pass it to the daemon's claim directory, which must be
# exactly 0700. The daemon creates that directory (.sparrow-inflight) and its lock (0600) with
# explicit modes, which the inherited ACL's mask follows, so its ownership checks still pass.
d /var/lib/sparrow/intake 0770 sparrow sparrow -
a+ /var/lib/sparrow/intake - - - - default:user::rwx,default:group::---,default:group:sparrow:rwx,default:mask::rwx,default:other::---
# The shipper's private state (queue, staging, ledgers). setgid so every staged item belongs to
# the sparrow group before it is renamed into a root, where the daemon reads it through that group;
# the shipper sets each item to 0640. The daemon never creates anything here.
d /var/lib/sparrow/ship 2700 sparrow-ship sparrow -
# The shipper's lock. It must exist with the shipper's owner: a lock that root's flock created would lock the shipper out.
f /var/lib/sparrow/ship/lock 0600 sparrow-ship sparrow -
