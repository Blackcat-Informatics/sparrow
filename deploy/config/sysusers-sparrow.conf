#
# Installed as /etc/sysusers.d/sparrow.conf by deploy/install.sh and applied with
# `systemd-sysusers sparrow.conf`. The daemon runs as the system user sparrow, whose primary group
# sparrow is also the access group of its private socket: a member can connect to
# /var/lib/sparrow/store/rpc.sock (mode 0660, in the 0710 store) and write the consume roots under
# /var/lib/sparrow/intake. Membership is full local administration of Sparrow; grant it deliberately.
#
# The shipper runs as its own system user, sparrow-ship, a member of the sparrow group so that it
# can ask the store about a spool it owns. Add the administrator's account as a member for the CLI
# (uncomment and edit the last line). Producers never join this group: they use the ingest-only
# group socket (docs/deployment.md, "Ingest-only group socket").

u sparrow - "Sparrow evidence server" /var/lib/sparrow/store /usr/bin/nologin
u sparrow-ship - "Sparrow shipper" - /usr/bin/nologin
m sparrow-ship sparrow
#m OPERATOR sparrow
