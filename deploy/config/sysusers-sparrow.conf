#
# Installed as /etc/sysusers.d/sparrow.conf by deploy/install.sh and applied with
# `systemd-sysusers sparrow.conf`. The daemon runs as the system user sparrow, whose primary group
# sparrow is also the access group of its private socket: a member can connect to
# /SPARROW/store/rpc.sock (mode 0660, in the 0710 store) and write the consume roots under
# /SPARROW/intake. Membership is full local administration of Sparrow; grant it deliberately.
#
# The operator account below is this host's; on another host, name its operator. The operator is
# the only member, for the CLI and administration. Fleet producers never join this group: they
# use the ingest-only group socket of issue #10.

u sparrow - "Sparrow evidence server" /SPARROW/store /usr/bin/nologin
m paudley sparrow
