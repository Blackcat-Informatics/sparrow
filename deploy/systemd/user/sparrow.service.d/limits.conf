#
# The old user unit's descriptor limit, installed as
# ~/.config/systemd/user/sparrow.service.d/limits.conf by deploy/user-unit-upgrade.sh in its stopped
# window. Without it the daemon inherits the user manager's soft limit of 1024, which a store of
# 917 table files exhausted (issue #148). The store keeps 1024 descriptors in reserve, bounds its
# table cache to the rest and refuses to open below 2048. The value matches the system unit's.
[Service]
LimitNOFILE=65536
